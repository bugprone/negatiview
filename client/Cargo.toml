[package]
name = "client"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"


[dependencies]
chrono = { version = "0.4.31", features = ["serde"] }
console_error_panic_hook = "0.1"
gloo = "0.12"
gloo-net = "0.7"
log = "0.4.20"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", features = ["json"], default-features = false }
serde = "1.0.188"
serde_json = "1.0.107"
thiserror = "2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
web-sys = "0.3"
yew = { version = "0.23", features = ["csr"] }
yew-hooks = "0.6"
yew-router = "0.20"
