services:
  postgres:
    image: postgres:17
    container_name: negatiview-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: negatiview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data: {}
  redis-data: {}
